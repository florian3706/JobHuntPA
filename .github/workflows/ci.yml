# Every push: unit tests, then the real setup + launch scripts on Linux, macOS
# and Windows (with the first run's folder step), a build + launch test of the
# Windows programs, and a build + start of the AppImage. A change that breaks
# setup or start-up fails here.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  setup-unix:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    # The account comes from the process environment (CI and headless servers; JOBHUNT_ADMIN_EMAIL is its name, an
    # older variable name); setup never writes it to .env. The first run's folder step is answered with the first-run
    # token the launcher hands to the app (here given beforehand), and the pointer goes to a throwaway folder.
    env:
      LLM_API_KEY: test-key
      LLM_BASE_URL: "https://example.invalid/v1"
      LLM_MODEL: test-model
      JOBHUNT_ADMIN_EMAIL: ci@example.invalid
      JOBHUNT_ADMIN_PASSWORD: ci-test-password-123
      JOBHUNT_FIRST_RUN_TOKEN: ci-first-run-token-0123456789abcdefghij
      JOBHUNT_CONFIG_DIR: ${{ github.workspace }}-config
      # The data folder the first run chooses: outside the app folder, as on Linux by default.
      DATA: ${{ github.workspace }}-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: One-time setup
        run: ./setup.sh --non-interactive --skip-browser
      - name: Setup is repeatable, asks nothing and writes no data
        run: |
          ./setup.sh --non-interactive --skip-browser </dev/null
          test ! -f .env && test ! -f data/jobhunt.db && test ! -e "$DATA" && test ! -e "$JOBHUNT_CONFIG_DIR"
      - name: First run, where the data lives (nothing is written before the choice)
        run: |
          ./start.sh --no-browser --port 8123 > launch.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8123/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8123/api/health
          curl -sf http://127.0.0.1:8123/api/auth/state | grep -q '"folder_required":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/workspaces)" = 401
          test ! -f data/jobhunt.db && test ! -e "$DATA" && test ! -e "$JOBHUNT_CONFIG_DIR"
          grep -q "first-run.html#token=$JOBHUNT_FIRST_RUN_TOKEN" launch.log
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"path\":\"$DATA\"}" http://127.0.0.1:8123/api/auth/data-folder)" = 403
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"token\":\"$JOBHUNT_FIRST_RUN_TOKEN\",\"path\":\"$DATA\"}" \
            http://127.0.0.1:8123/api/auth/data-folder | grep -q '"restarting":true'
          # The app restarts on the folder (the launcher starts it again) and makes the account from the environment
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8123/api/auth/state | grep -q '"folder_required":false' && break; sleep 1; done
          curl -sf http://127.0.0.1:8123/api/auth/state | grep -q '"setup_required":false'
          test -f "$JOBHUNT_CONFIG_DIR/data-folder.json"
      - name: Signing in, and the AI settings saved in the data folder
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/workspaces)" = 401
          curl -sf -c jar -H 'Content-Type: application/json' \
            -d "{\"name\":\"$JOBHUNT_ADMIN_EMAIL\",\"password\":\"$JOBHUNT_ADMIN_PASSWORD\",\"remember\":true}" \
            http://127.0.0.1:8123/api/auth/login > login.json
          csrf="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["csrf"])' login.json)"
          curl -sf -b jar http://127.0.0.1:8123/api/workspaces | grep -q '"My job search"'
          curl -sf -b jar http://127.0.0.1:8123/api/encryption/status | grep -q '"state":"done"'
          curl -sf http://127.0.0.1:8123/ | grep -q JobHuntPA
          curl -sf http://127.0.0.1:8123/login.html | grep -q 'autocomplete="current-password"'
          # The first run's AI step saves through the Settings endpoint, into the data folder's .env
          curl -sf -b jar -X PUT -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            -d '{"base_url":"https://example.invalid/v1","model":"test-model","api_key":"test-key-123"}' \
            http://127.0.0.1:8123/api/settings/llm | grep -q '"model":"test-model"'
          grep -q '^LLM_MODEL=test-model' "$DATA/.env" && test ! -f .env
          test -f "$DATA/server-keys.json" && test ! -f "$DATA/first-run.txt" && test ! -f data/jobhunt.db
      - name: Restart (key file, its fingerprint and database sessions)
        run: |
          pkill -f "uvicorn backend.app:app" || true
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/health || break; sleep 1; done
          ./start.sh --no-browser --port 8123 > launch2.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8123/api/health && break; sleep 1; done
          curl -sf -b jar http://127.0.0.1:8123/api/auth/me | grep -q "\"name\":\"$JOBHUNT_ADMIN_EMAIL\""
          curl -sf -c jar2 -H 'Content-Type: application/json' \
            -d "{\"name\":\"$JOBHUNT_ADMIN_EMAIL\",\"password\":\"$JOBHUNT_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:8123/api/auth/login
          curl -sf -b jar2 http://127.0.0.1:8123/api/workspaces
          # The AI settings are the signed-in account's to see (no admin role any more)
          curl -sf -b jar2 http://127.0.0.1:8123/api/settings/llm | grep -q '"model":"test-model"'
      - name: The reset tool refuses while the app runs, then starts over
        run: |
          if ./reset.sh --confirm RESET; then echo "reset ran while the app was running"; exit 1; fi
          test -f "$DATA/server-keys.json"
          pkill -f "uvicorn backend.app:app" || true
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/health || break; sleep 1; done
          sleep 1
          if ./reset.sh </dev/null; then echo "reset ran without being confirmed"; exit 1; fi
          if ./reset.sh --confirm no; then echo "reset ran without the word"; exit 1; fi
          test -f "$DATA/server-keys.json"
          if ./reset.sh --confirm reset; then echo "reset ran with the word in small letters"; exit 1; fi
          ./reset.sh --confirm RESET
          test ! -f "$DATA/server-keys.json"
          test -f "$DATA/.env" && grep -q '^LLM_MODEL=test-model' "$DATA/.env"
          # The next start is a first run: here the account comes from the environment again
          ./start.sh --no-browser --port 8123 > launch3.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8123/api/health && break; sleep 1; done
          test -f "$DATA/server-keys.json"
          curl -sf -c jar3 -H 'Content-Type: application/json' \
            -d "{\"name\":\"$JOBHUNT_ADMIN_EMAIL\",\"password\":\"$JOBHUNT_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:8123/api/auth/login
      - name: Uninstall (backs up data, removes the folder)
        run: |
          pkill -f "uvicorn backend.app:app" || true
          sleep 2
          # Uninstall a copy: the runner's own clean-up steps need the checkout folder.
          cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/JobHuntPA-app"
          "$RUNNER_TEMP/JobHuntPA-app/uninstall.sh" --yes
          test ! -d "$RUNNER_TEMP/JobHuntPA-app"
          # The data folder the pointer names, outside the app folder, is backed up and removed, and so is the pointer
          test ! -e "$DATA" && test ! -f "$JOBHUNT_CONFIG_DIR/data-folder.json"
          backup="$(ls ~/Documents/JobHuntPA-backup-*.zip ~/JobHuntPA-backup-*.zip 2>/dev/null | head -1)"
          test -n "$backup"
          python3 -m zipfile -l "$backup" | grep -q data/server-keys.json
          python3 -m zipfile -l "$backup" | grep -q data/.env
          test "$(python3 -c 'import os, stat, sys; print(oct(stat.S_IMODE(os.stat(sys.argv[1]).st_mode)))' "$backup")" = 0o600
      - if: failure()
        run: cat launch.log launch2.log launch3.log || true

  windows:
    runs-on: windows-latest
    env:
      LLM_API_KEY: test-key
      LLM_BASE_URL: "https://example.invalid/v1"
      LLM_MODEL: test-model
      JOBHUNT_ADMIN_EMAIL: ci@example.invalid
      JOBHUNT_ADMIN_PASSWORD: ci-test-password-123
      JOBHUNT_FIRST_RUN_TOKEN: ci-first-run-token-0123456789abcdefghij
      JOBHUNT_CONFIG_DIR: ${{ github.workspace }}-config
      # The data folder the first run chooses (Windows suggests data in the install folder; this tests another one).
      DATA: ${{ github.workspace }}-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Shared setup
        run: python installer/installer.py --non-interactive --skip-browser
      - name: Build the Windows programs
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --console --name JobHuntPA installer/windows_launch.py
          pyinstaller --onefile --console --name JobHuntPA-Uninstall installer/uninstaller.py
          pyinstaller --onefile --console --name JobHuntPA-Reset installer/windows_reset.py
          pyinstaller --onefile --console --name JobHuntPA-Setup --add-data "dist/JobHuntPA.exe;." --add-data "dist/JobHuntPA-Uninstall.exe;." --add-data "dist/JobHuntPA-Reset.exe;." --add-data "VERSION;." installer/windows_setup.py
      - name: JobHuntPA.exe starts the app, and signing in works
        shell: pwsh
        run: |
          Start-Process -FilePath dist\JobHuntPA.exe -ArgumentList "--no-browser","--port","8123"
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8123/api/health | Out-Null; $up = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $up) { Write-Error "the app did not start"; exit 1 }
          # The first run's step 1: where the data lives (nothing written before the choice), then the restart
          $state = Invoke-RestMethod http://127.0.0.1:8123/api/auth/state
          if (-not $state.folder_required) { Write-Error "the first run didn't ask where the data lives"; exit 1 }
          if ((Test-Path data\jobhunt.db) -or (Test-Path $env:DATA)) { Write-Error "data was written before the folder was chosen"; exit 1 }
          $folder = @{ token = $env:JOBHUNT_FIRST_RUN_TOKEN; path = $env:DATA } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8123/api/auth/data-folder -ContentType 'application/json' -Body $folder | Out-Null
          $back = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            try { if (-not (Invoke-RestMethod http://127.0.0.1:8123/api/auth/state).folder_required) { $back = $true; break } } catch { }
          }
          if (-not $back) { Write-Error "the app did not come back after the folder step"; exit 1 }
          if (-not (Test-Path "$env:JOBHUNT_CONFIG_DIR\data-folder.json")) { Write-Error "no pointer"; exit 1 }
          $r = Invoke-WebRequest http://127.0.0.1:8123/api/workspaces -SkipHttpErrorCheck
          if ($r.StatusCode -ne 401) { Write-Error "expected 401 before signing in, got $($r.StatusCode)"; exit 1 }
          $body = @{ name = $env:JOBHUNT_ADMIN_EMAIL; password = $env:JOBHUNT_ADMIN_PASSWORD } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8123/api/auth/login -ContentType 'application/json' -Body $body -SessionVariable s | Out-Null
          $ws = Invoke-RestMethod -Uri http://127.0.0.1:8123/api/workspaces -WebSession $s
          if (@($ws).Count -lt 1) { Write-Error "no workspace after signing in"; exit 1 }
          # The reset tool refuses while the app runs (the key file's lock and running.json), as on Linux and macOS
          & dist\JobHuntPA-Reset.exe --confirm RESET
          if ($LASTEXITCODE -eq 0) { Write-Error "the reset ran while the app was running"; exit 1 }
          if (-not (Test-Path "$env:DATA\server-keys.json")) { Write-Error "the key file went while the app was running"; exit 1 }
          exit 0
      - name: JobHuntPA-Reset.exe starts over with the app stopped
        shell: pwsh
        run: |
          Get-Process JobHuntPA, python -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          if (-not (Test-Path "$env:DATA\server-keys.json")) { Write-Error "no key file before the reset"; exit 1 }
          & dist\JobHuntPA-Reset.exe --confirm no
          if ($LASTEXITCODE -eq 0) { Write-Error "the reset ran without the word"; exit 1 }
          & dist\JobHuntPA-Reset.exe --confirm reset
          if ($LASTEXITCODE -eq 0) { Write-Error "the reset ran with the word in small letters"; exit 1 }
          & dist\JobHuntPA-Reset.exe --confirm RESET
          if ($LASTEXITCODE -ne 0) { Write-Error "the reset failed"; exit 1 }
          if (Test-Path "$env:DATA\server-keys.json") { Write-Error "the key file is still there"; exit 1 }
          exit 0
      - name: JobHuntPA-Uninstall.exe removes the app
        shell: pwsh
        run: |
          Get-Process JobHuntPA, python -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          $app = "$env:RUNNER_TEMP\JobHuntPA-app"
          Copy-Item -Recurse $env:GITHUB_WORKSPACE $app
          & dist\JobHuntPA-Uninstall.exe --yes --folder $app
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path $env:DATA) { Write-Error "the data folder is still there"; exit 1 }
          if (Test-Path "$env:JOBHUNT_CONFIG_DIR\data-folder.json") { Write-Error "the pointer is still there"; exit 1 }
          for ($i = 0; $i -lt 30; $i++) { if (-not (Test-Path $app)) { exit 0 }; Start-Sleep 1 }
          Write-Error "app folder still present"; exit 1

  appimage:
    # The oldest supported Ubuntu runner, as release.yml builds it: an AppImage runs on systems at least as new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          bash installer/appimage.sh
      - name: It starts without a browser, answers, and its first run works
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # no FUSE needed on the runner
          JOBHUNT_FIRST_RUN_TOKEN: ci-first-run-token-0123456789abcdefghij
        run: |
          home="$RUNNER_TEMP/appimage-home"
          mkdir -p "$home"
          image="$(ls dist/JobHuntPA-*-x86_64.AppImage)"
          env -u PLAYWRIGHT_BROWSERS_PATH HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" \
            "$image" --no-browser --port 8124 > appimage.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8124/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8124/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:8124/api/auth/state | grep -q '"folder_required":true'
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"token\":\"$JOBHUNT_FIRST_RUN_TOKEN\",\"path\":\"$home/.local/share/JobHuntPA\"}" \
            http://127.0.0.1:8124/api/auth/data-folder | grep -q '"restarting":true'
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8124/api/auth/state | grep -q '"folder_required":false' && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"token\":\"$JOBHUNT_FIRST_RUN_TOKEN\",\"name\":\"CI\",\"password\":\"ci-test-password-123\"}" \
            http://127.0.0.1:8124/api/auth/first-run)" = 201
          test -f "$home/.local/share/JobHuntPA/server-keys.json"
          test -f "$home/.config/JobHuntPA/data-folder.json"
          test ! -e "$home/.local/share/JobHuntPA/browsers"  # the browser is only downloaded when the person agrees
          HOME="$home" XDG_CONFIG_HOME="$home/.config" "$image" --stop
      - if: failure()
        run: cat appimage.log || true
