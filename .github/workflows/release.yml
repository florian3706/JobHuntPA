# Push a tag like v1.2.0 (matching the VERSION file) to publish JobHuntPA-Setup.exe, JobHuntPA.exe,
# JobHuntPA-Uninstall.exe, JobHuntPA-Reset.exe and the Linux AppImage on the GitHub Releases page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tag matches VERSION
        shell: bash
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != VERSION $(cat VERSION)"; exit 1; }
      - name: Build
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --console --name JobHuntPA installer/windows_launch.py
          pyinstaller --onefile --console --name JobHuntPA-Uninstall installer/uninstaller.py
          pyinstaller --onefile --console --name JobHuntPA-Reset installer/windows_reset.py
          pyinstaller --onefile --console --name JobHuntPA-Setup --add-data "dist/JobHuntPA.exe;." --add-data "dist/JobHuntPA-Uninstall.exe;." --add-data "dist/JobHuntPA-Reset.exe;." --add-data "VERSION;." installer/windows_setup.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JobHuntPA-Setup.exe
            dist/JobHuntPA.exe
            dist/JobHuntPA-Uninstall.exe
            dist/JobHuntPA-Reset.exe
          body: |
            **Windows:** download **JobHuntPA-Setup.exe** and run it (Windows may warn about an unknown publisher: click *More info*, then *Run anyway*). It installs everything and adds a JobHuntPA shortcut. `JobHuntPA.exe` (app launcher), `JobHuntPA-Uninstall.exe` and `JobHuntPA-Reset.exe` (starts over when the password and every recovery code are lost) are installed by setup; to remove JobHuntPA use Settings > Apps or the Start-menu *Uninstall JobHuntPA* shortcut.
            **Linux:** download **JobHuntPA-<version>-x86_64.AppImage**, make it executable (`chmod +x`, or the file's Properties) and run it: it opens in your browser. `--service install` starts it at boot, `--reset` is the reset tool and `--uninstall` removes it (see the README).
            **macOS:** download the source code zip below and follow the README.

  appimage:
    # The oldest supported Ubuntu runner: the AppImage then runs on that and every newer Linux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != VERSION $(cat VERSION)"; exit 1; }
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          bash installer/appimage.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JobHuntPA-*-x86_64.AppImage
